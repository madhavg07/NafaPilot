[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
    "live: calls the real Gemini API; run only with RUN_LIVE_LLM=1 and -m live",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["../scripts/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
