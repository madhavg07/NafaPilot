# Alembic configuration. Run from the backend folder:
#   alembic upgrade head      apply migrations
#   alembic downgrade -1      undo the latest migration
# The database URL comes from DATABASE_URL (project .env); it is not stored here.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is intentionally empty; migrations/env.py reads app settings.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
